name: site

# byo.dev reads docs/ from main and this package's version from npm when it builds.
# Ask it to rebuild after either changes, instead of waiting for its nightly run.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # npm keeps serving the old version as latest for a minute or two after a
      # publish; a build in that gap labels main's version "next" until the nightly
      - name: Wait for npm to serve the release
        if: github.event_name == 'workflow_run'
        run: sleep 300
      - name: Dispatch a byo.dev rebuild
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; byo.dev picks this up in its nightly build."
            exit 0
          fi
          gh api repos/byo-oss/site/dispatches -f event_type=package-released
